# The test suite, run the way CI runs it.
#
# An overlay on compose.yaml rather than a service in it: the test image is
# never part of a running store, and keeping it here means `docker compose
# up` cannot start it by accident.
#
#     mkdir -p webapp/server/test-reports
#     docker compose -f compose.yaml -f compose.ci.yaml run --rm test
#
# That runs pytest --cov-fail-under=60 (the image's CMD) against the same
# postgres:16 the store uses, and leaves junit.xml and coverage.xml in
# webapp/server/test-reports/ for the Jenkins publishers. A marker subset is one
# more argument:
#
#     docker compose -f compose.yaml -f compose.ci.yaml run --rm test pytest -m unit
#
# The mkdir matters. A bind mount whose host directory does not exist is
# created by the daemon as root, and the container runs as UID 1000, so the
# first run in a fresh Jenkins workspace would fail writing the reports.
#
# compose.yaml's required variables (SECRET_KEY, POSTGRES_PASSWORD) are
# checked when the file is parsed, so they must be set even though the test
# database is throwaway. In CI they come from the pipeline's environment;
# their values do not matter here.

services:

  test:
    image: rmit-store-api-test:${GIT_COMMIT:-dev}
    build:
      context: ./webapp/server
      target: test
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
        APP_VERSION: ${APP_VERSION:-1.0.0}
    environment:
      # pytest-django creates test_<name> from this and drops it afterwards.
      # The postgres image's POSTGRES_USER is a superuser, so CREATEDB is not
      # a question.
      DATABASE_URL: postgres://${POSTGRES_USER:-rmit}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set -- see .env.example}@db:5432/${POSTGRES_DB:-rmit_store}
    volumes:
      - ./webapp/server/test-reports:/app/test-reports
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
