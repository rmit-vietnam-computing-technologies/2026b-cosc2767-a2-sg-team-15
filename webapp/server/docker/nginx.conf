#   References: nginx proxy module,
#   https://nginx.org/en/docs/http/ngx_http_proxy_module.html; running nginx
#   as a non-root user, https://hub.docker.com/r/nginxinc/nginx-unprivileged

# nginx in front of gunicorn, same container. Replaces /etc/nginx/nginx.conf
# wholesale so Debian's sites-enabled default never loads.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile   on;

    client_max_body_size 10M;

    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    upstream django {
        server 127.0.0.1:8000;
    }

    server {
        listen      80 default_server;
        server_name _;

        # Probes arrive with the pod IP as Host. A fixed Host keeps them out of ALLOWED_HOSTS.
        location ~ ^/(healthz|readyz)/ {
            proxy_pass       http://django;
            proxy_set_header Host localhost;
            access_log       off;
        }

        # Same for Prometheus, which sends the scrape target as Host.
        location = /metrics {
            proxy_pass       http://django;
            proxy_set_header Host localhost;
            access_log       off;
        }

        # collectstatic output, straight from disk. Hashed names, so cache forever.
        location /static/ {
            alias      /app/staticfiles/;
            expires    1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location / {
            add_header Access-Control-Allow-Origin "http://ae4e4e168f4c64c2cb01d73858cbe1bb-56540307.us-east-1.elb.amazonaws.com" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

            proxy_pass http://django;

            # Browser Host goes through untouched: Django builds image_url from it.
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_redirect off;

            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }
    }
}
