[pytest]
# The whole suite runs against config.settings.test.
DJANGO_SETTINGS_MODULE = config.settings.test

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Machine-readable output for Jenkins.
#
#   junit.xml     -> JUnit publisher: per-test results, trends, failure diffs
#   coverage.xml  -> Cobertura plugin: line and branch coverage over time
#
# Written on every run, not behind a CI-only flag, so what runs on a laptop is
# byte-identical to what runs on an agent. The one thing worse than no CI is
# CI that runs a different command than the developer did.
#
# `-m "not smoke"` excludes the deployment suite by default: it needs a live
# URL and would fail on a laptop with nothing deployed. Run it explicitly with
# `pytest -m smoke`.
addopts =
    -ra
    --strict-markers
    --strict-config
    -m "not smoke"
    --cov=apps
    --cov-report=term-missing:skip-covered
    --cov-report=xml:test-reports/coverage.xml
    --junitxml=test-reports/junit.xml

# One known upstream warning, downgraded so the CI log stays
# readable and a NEW warning is visible rather than lost in the noise.
#
# OrderViewSet.get_queryset annotates item_count with Sum(), and Django drops
# Meta.ordering on an aggregate query to avoid an incorrect GROUP BY. The
# order list is therefore genuinely unordered, so paging order history can
# show a row twice and skip another. It is a real defect and it is recorded
# in the Known Bugs section of the report -- it is not fixed here because
# apps/orders/views.py is upstream and the brief is explicit that the
# pipeline is the deliverable, not the application.
#
# Scoped to this one message. `error` is not used as the default because
# third-party deprecations would then fail the build on an unrelated
# dependency bump.
filterwarnings =
    ignore::django.core.paginator.UnorderedObjectListWarning

# --strict-markers turns a typo'd marker into an error instead of silently
# collecting nothing. Every marker must be declared here.
markers =
    unit: pure functions, no database, no network
    integration: exercises the API and the database together
    smoke: runs against a deployed URL; requires SMOKE_BASE_URL
    slow: excluded from the fast pre-commit loop with -m "not slow"

# Coverage target: 60% overall, enforced in CI only.
#
# The gate is deliberately NOT in addopts. A marker subset is a legitimate
# way to run this suite -- `pytest -m unit` reports about 16% because it
# exercises one sixth of the code on purpose -- and a threshold in addopts
# turns that into a red run, which trains people to pass --no-cov and throws
# the gate away entirely. CI runs the identical suite and adds the flag:
#
#     pytest --cov-fail-under=60
#
# 60 is a ratchet, not an ambition. It sits just under the current figure so
# a regression fails the build, and it moves up if suites are added. The number worth defending in the report is not this one: it
# is that the paths where a defect costs money or leaks data are near total
# --  payments.py at 100%, core/permissions.py at 85%, catalog/views.py at
# 79% -- while the overall figure is held down by management commands that
# are exercised by deploying, not by unit tests, and by the review and
# order-cancellation paths that are deliberately out of scope
# (tests/README.md).