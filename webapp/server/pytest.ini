[pytest]
DJANGO_SETTINGS_MODULE = config.settings.test

testpaths = tests
python_files = test_*.py
python_functions = test_*

# Smoke needs a deployed URL, so it is opt-in: pytest -m smoke --no-cov
# junit.xml and coverage.xml land in test-reports/ for Jenkins on every run.
addopts =
    -ra
    --strict-markers
    --strict-config
    -m "not smoke"
    --cov=apps
    --cov-report=term-missing:skip-covered
    --cov-report=xml:test-reports/coverage.xml
    --junitxml=test-reports/junit.xml

markers =
    unit: pure functions, no database, no network
    integration: the API and the database together
    smoke: against a deployed URL, needs SMOKE_BASE_URL
