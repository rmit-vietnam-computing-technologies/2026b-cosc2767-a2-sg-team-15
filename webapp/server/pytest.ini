[pytest]
# The whole suite runs against config.settings.test.
DJANGO_SETTINGS_MODULE = config.settings.test

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# junit.xml and coverage.xml for the Jenkins
# publishers, written on every run so a laptop runs what CI runs.
# Smoke is excluded by default: it needs a deployed URL (`pytest -m smoke`).
addopts =
    -ra
    --strict-markers
    --strict-config
    -m "not smoke"
    --cov=apps
    --cov-report=term-missing:skip-covered
    --cov-report=xml:test-reports/coverage.xml
    --junitxml=test-reports/junit.xml

# One known upstream warning (OrderViewSet drops Meta.ordering on an
# aggregate query; recorded under Known Bugs in the report), silenced so a
# new warning stands out.
filterwarnings =
    ignore::django.core.paginator.UnorderedObjectListWarning

# --strict-markers: every marker must be declared here.
markers =
    unit: pure functions, no database, no network
    integration: exercises the API and the database together
    smoke: runs against a deployed URL; requires SMOKE_BASE_URL
    slow: excluded from the fast pre-commit loop with -m "not slow"

# Coverage gate: 60%, on the CI command line only
# (`pytest --cov-fail-under=60`), so a marker subset stays green locally.
# A ratchet just under the current figure; see tests/README.md.