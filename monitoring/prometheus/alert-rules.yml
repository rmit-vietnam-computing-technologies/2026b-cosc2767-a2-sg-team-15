groups:
  - name: rmit-store-alerts
    rules:

      # 1. Backend completely unreachable
      - alert: BackendDown
        expr: up{job="rmit-store-django"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "RMIT store backend is down"
          description: "Prometheus unable to scrape the Django backend for more than 2 minutes."

      # 2. Too many HTTP 5xx responses
      - alert: HighHTTP5xxRate
        expr: |
          (
            sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[5m]))
            /
            sum(rate(django_http_responses_total_by_status_total[5m]))
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RMIT store has high HTTP 5xx rate"
          description: "More than 5% of HTTP responses have been 5xx errors for the last 5 minutes."

      # 3. High 95th-percentile request latency
      - alert: HighHTTP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (
              rate(django_http_requests_latency_seconds_by_view_method_bucket[5m])
            )
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RMIT store HTTP latency is high"
          description: "95th-percentile HTTP request latency exceeded 1 second for the last 5 minutes."
