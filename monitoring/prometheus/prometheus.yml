global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert-rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "rmit-store-django"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "ae4e4e168f4c64c2cb01d73858cbe1bb-56540307.us-east-1.elb.amazonaws.com:80" 