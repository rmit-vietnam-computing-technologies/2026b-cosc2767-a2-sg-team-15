# The whole store on one host, for local work and for CI's database.
#
#     cp .env.example .env && $EDITOR .env
#     docker compose up -d --build
#     docker compose --profile seed run --rm seed
#
# Start order: db healthy, migrate exits 0, api ready, web. Migrations run
# once in their own container. Only web publishes a port.

name: rmit-store

x-api-build: &api-build
  context: ./webapp/server
  target: runtime
  args:
    GIT_COMMIT: ${GIT_COMMIT:-dev}
    APP_VERSION: ${APP_VERSION:-1.0.0}

# The :? entries refuse to start with a placeholder.
x-api-environment: &api-environment
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is not set, copy .env.example to .env}
  DATABASE_URL: postgres://${POSTGRES_USER:-rmit}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set, see .env.example}@db:5432/${POSTGRES_DB:-rmit_store}
  ALLOWED_HOSTS: ${PUBLIC_HOST:-localhost},127.0.0.1,api,web
  CLIENT_URL: ${PUBLIC_ORIGIN:-http://localhost}
  CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
  CSRF_TRUSTED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
  SESSION_COOKIE_SECURE: ${COOKIE_SECURE:-False}
  CSRF_COOKIE_SECURE: ${COOKIE_SECURE:-False}
  USE_S3: ${USE_S3:-False}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}

services:

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rmit_store}
      POSTGRES_USER: ${POSTGRES_USER:-rmit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set, see .env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmit} -d ${POSTGRES_DB:-rmit_store}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Same image, different command; api waits for its exit code.
  migrate:
    image: rmit-store-api:${GIT_COMMIT:-dev}
    build: *api-build
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: rmit-store-api:${GIT_COMMIT:-dev}
    build: *api-build
    environment:
      <<: *api-environment
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Readiness, not liveness: web must not point at an api whose database is down.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/readyz/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 35s
    restart: unless-stopped

  web:
    image: rmit-store-web:${GIT_COMMIT:-dev}
    build:
      context: ./webapp/client
    environment:
      API_UPSTREAM: api:80
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/web.conf.template:/etc/nginx/templates/default.conf.template:ro
      - media:/srv/media:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Demo data, behind a profile so a plain up never seeds.
  seed:
    image: rmit-store-api:${GIT_COMMIT:-dev}
    build: *api-build
    profiles: [seed]
    command:
      - python
      - manage.py
      - seed_demo
      - --demo-users
      - --admin-email
      - ${SEED_ADMIN_EMAIL:-admin@rmit.edu.au}
      - --admin-password
      - ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is not set, see .env.example}
    environment: *api-environment
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  pgdata:
  media: