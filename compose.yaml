# Acknowledgement: Encodes the start order deploy/plan-c/site.yml expresses as
#   play order and the environment api.env.j2 renders. Drafted with Claude
#   (Anthropic) in a guided session; the author ran and verified the stack.
#   References: Compose file reference,
#   https://docs.docker.com/reference/compose-file/; depends_on conditions,
#   https://docs.docker.com/reference/compose-file/services/#depends_on

# The whole store on one host.
#
#     cp .env.example .env && $EDITOR .env
#     docker compose up -d --build
#     docker compose --profile seed run --rm seed     # demo data, when wanted
#
# Start order is enforced: db healthy -> migrate exits 0 -> api ready -> web.
# Migrations run once, in their own container, even under --scale api=2.
# Only web publishes a port.

name: rmit-store

# ---------------------------------------------------------------------------
# Shared definitions
# ---------------------------------------------------------------------------

x-api-build: &api-build
  context: ./webapp/server
  target: runtime
  args:
    GIT_COMMIT: ${GIT_COMMIT:-dev}
    APP_VERSION: ${APP_VERSION:-1.0.0}

# Every variable the API receives, interpolated from .env.
# The `:?` entries refuse to start the stack with a placeholder.
x-api-environment: &api-environment
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is not set -- copy .env.example to .env and fill it in}
  DATABASE_URL: postgres://${POSTGRES_USER:-rmit}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set -- see .env.example}@db:5432/${POSTGRES_DB:-rmit_store}
  # Browser host, readiness check, in-network callers
  # (Prometheus, the smoke suite). Django returns 400 for any other Host.
  ALLOWED_HOSTS: ${PUBLIC_HOST:-localhost},127.0.0.1,api,web
  CLIENT_URL: ${PUBLIC_ORIGIN:-http://localhost}
  CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
  CSRF_TRUSTED_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost}
  # prod.py defaults both to True; over plain http the admin login loops.
  SESSION_COOKIE_SECURE: ${COOKIE_SECURE:-False}
  CSRF_COOKIE_SECURE: ${COOKIE_SECURE:-False}
  # Off by default; the media volume is enough on one host.
  USE_S3: ${USE_S3:-False}
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------

services:

  # A container here, RDS in Plan F.
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rmit_store}
      POSTGRES_USER: ${POSTGRES_USER:-rmit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set -- see .env.example}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The gate migrate waits on.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rmit} -d ${POSTGRES_DB:-rmit_store}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Migrations as a one-shot container: same image,
  # different command, api waits for its exit code. Safe to repeat.
  migrate:
    image: rmit-store-api:${GIT_COMMIT:-dev}
    build: *api-build
    command: ["python", "manage.py", "migrate", "--noinput"]
    environment: *api-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: rmit-store-api:${GIT_COMMIT:-dev}
    build: *api-build
    environment:
      <<: *api-environment
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
    volumes:
      # Uploads, shared with web. One host only; S3 beyond that.
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Readiness, overriding the image's liveness check:
    # web must not be pointed at an api whose database is not up.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/readyz/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    # gunicorn's graceful shutdown is 30s; Compose's default 10s would SIGKILL it.
    stop_grace_period: 35s
    restart: unless-stopped

  # The only published port. The image is the frontend
  # workstream's; the site this stack needs (SPA fallback, /api/ proxy,
  # /media/ volume) is mounted as a template the nginx entrypoint renders
  # over the built-in one at start.
  web:
    image: rmit-store-web:${GIT_COMMIT:-dev}
    build:
      context: ./webapp/client
    environment:
      API_UPSTREAM: api:80
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/web.conf.template:/etc/nginx/templates/default.conf.template:ro
      - media:/srv/media:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # Demo catalogue, behind a profile so a plain `up` never seeds. Idempotent.
  # Mounts media because the product photographs are uploads.
  seed:
    image: rmit-store-api:${GIT_COMMIT:-dev}
    build: *api-build
    profiles: [seed]
    command:
      - python
      - manage.py
      - seed_demo
      - --demo-users
      - --admin-email
      - ${SEED_ADMIN_EMAIL:-admin@rmit.edu.au}
      - --admin-password
      - ${SEED_ADMIN_PASSWORD:?SEED_ADMIN_PASSWORD is not set -- see .env.example}
    environment: *api-environment
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

volumes:
  pgdata:
  media:
