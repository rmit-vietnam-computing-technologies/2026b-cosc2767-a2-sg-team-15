# Acknowledgement: Adapted from step 9.4 of UPSTREAM-README.md. Changed from
#   the original: alias paths match this repository's layout, and a
#   /api/version/ note plus gzip for the bundle were added. References:
#   nginx try_files, https://nginx.org/en/docs/http/ngx_http_core_module.html#try_files
#   Django behind a proxy, https://docs.djangoproject.com/en/5.1/ref/settings/#use-x-forwarded-host

# [T15-BE-NGINX][REQ-7][REQ-1] One origin, three kinds of content.
#
# Install to /etc/nginx/conf.d/rmit-store.conf, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx owns port 80 and is the only thing the internet talks to. It serves
# the built SPA from disk, uploaded images from disk, Django's collected
# static files from disk, and reverse-proxies everything Django-shaped to
# gunicorn on 127.0.0.1:8000. The browser sees a single origin, so CORS never
# comes up -- which is why Plan B is simpler than Plan C, and why splitting
# the tiers later is a real change rather than a cosmetic one.

server {
    listen       80 default_server;
    listen  [::]:80 default_server;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Product photographs are larger than nginx's 1M default, which would 413
    # on a seller upload with an error that mentions nothing about size.
    client_max_body_size 10M;

    # The bundle is a few hundred KB of JavaScript. Hashed assets are already
    # immutable; compressing them costs one CPU cycle per cache miss.
    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # --- The SPA -----------------------------------------------------------
    # History-mode routing: an unknown path is a Vue route, not a missing
    # file. Without the fallback, navigating to /shop inside the app works and
    # refreshing that same page returns 404 -- a bug that only appears on
    # reload, which is exactly the kind that survives manual testing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # [T15-FE-CONFIG] Runtime configuration must never be cached.
    #
    # config.js is what lets one built artifact be promoted from staging to
    # production unchanged. Cache it and editing API_BASE_URL on the server
    # does nothing until every browser hard-reloads, which defeats the entire
    # design.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Hashed bundle filenames are immutable by construction: a changed file
    # gets a changed name, so this can never serve something stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Django ------------------------------------------------------------
    # /api/ is what the SPA calls. /admin/ and the two probes are proxied
    # because port 8000 is closed to the internet and they would otherwise be
    # unreachable. /healthz/ and /readyz/ become the target group's health
    # check in Plan F, and /api/version/ is how a deploy script confirms which
    # build is serving -- all three have to work from outside the instance.
    location ~ ^/(api|admin|healthz|readyz)(/|$) {
        proxy_pass http://127.0.0.1:8000;

        # [T15-BE-HOSTHDR] proxy_set_header Host is load-bearing.
        #
        # proxy_pass sends `Host: $proxy_host` by default, so Django would see
        # Host: 127.0.0.1:8000 and build every image_url as
        # http://127.0.0.1:8000/media/... -- an address that resolves to the
        # *browser's* machine. Every product image breaks, and the console
        # error mentions CORS and private address spaces, neither of which is
        # the actual problem.
        #
        # prod.py sets USE_X_FORWARDED_HOST = True, so Django prefers
        # X-Forwarded-Host under gunicorn. Both are set so it is correct
        # either way. Whichever host is forwarded must be in ALLOWED_HOSTS or
        # Django answers 400 before reaching a view.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- Uploaded product images -------------------------------------------
    # Served from disk, not proxied. Under gunicorn Django returns 404 for
    # uploaded media by design, so forwarding /media/ to port 8000 forwards
    # you to a 404.
    #
    # Needing `chmod o+x /home/ec2-user` for nginx to traverse into this path
    # is the whole argument for moving media to S3: the moment a second
    # instance exists, an image uploaded to one is a 404 from the other, and
    # no amount of chmod fixes that.
    location /media/ {
        alias /home/ec2-user/2026b-cosc2767-a2-sg-team-15/webapp/server/media/;
        access_log off;
        expires 7d;
    }

    # --- Django's own static files: admin CSS, DRF, Swagger ----------------
    # Needs its own block. Without it, `location /` answers with index.html
    # and /admin/ renders as unstyled black-on-white text. Static files and
    # uploaded media are two different problems with two different fixes.
    location /static/ {
        alias /home/ec2-user/2026b-cosc2767-a2-sg-team-15/webapp/server/staticfiles/;
        access_log off;
        expires 7d;
    }
}
