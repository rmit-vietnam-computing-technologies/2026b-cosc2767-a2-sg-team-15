# Acknowledgement: Adapted from step 9.4 of UPSTREAM-README.md. Changed from
#   the original: alias paths match this repository's layout, and a
#   /api/version/ note plus gzip for the bundle were added. References:
#   nginx try_files, https://nginx.org/en/docs/http/ngx_http_core_module.html#try_files
#   Django behind a proxy, https://docs.djangoproject.com/en/5.1/ref/settings/#use-x-forwarded-host

# Single-instance site: SPA, media and static
# from disk, everything Django-shaped proxied to gunicorn on 127.0.0.1:8000.
# Install to /etc/nginx/conf.d/rmit-store.conf; nginx -t && systemctl reload nginx.

server {
    listen       80 default_server;
    listen  [::]:80 default_server;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Product photographs exceed nginx's 1M default (413 on upload).
    client_max_body_size 10M;

    gzip              on;
    gzip_types        text/css application/javascript application/json image/svg+xml;
    gzip_min_length   1024;

    # --- The SPA: an unknown path is a Vue route, not a missing file --------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache runtime configuration.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Hashed filenames are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # --- Django: /api/, /admin/ and the probes, all proxied ------------------
    location ~ ^/(api|admin|healthz|readyz)(/|$) {
        proxy_pass http://127.0.0.1:8000;

        # Forward the browser's Host: Django builds image_url
        # from it, and it must be in ALLOWED_HOSTS.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # --- Uploaded product images, from disk (Django does not serve media in prod)
    location /media/ {
        alias /home/ec2-user/2026b-cosc2767-a2-sg-team-15/webapp/server/media/;
        access_log off;
        expires 7d;
    }

    # --- Django's own static files: admin CSS, DRF, Swagger ----------------
    location /static/ {
        alias /home/ec2-user/2026b-cosc2767-a2-sg-team-15/webapp/server/staticfiles/;
        access_log off;
        expires 7d;
    }
}
