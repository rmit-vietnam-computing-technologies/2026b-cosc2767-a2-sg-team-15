[defaults]
inventory             = inventory.ini
roles_path            = roles
host_key_checking     = False
result_format         = yaml
display_skipped_hosts = False
interpreter_python    = auto_silent
timeout               = 60

[ssh_connection]
pipelining = True
retries    = 3
ssh_args   = -o ControlMaster=auto -o ControlPersist=300s
