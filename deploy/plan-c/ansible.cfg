[defaults]
inventory            = inventory.ini
roles_path           = roles
host_key_checking    = False
stdout_callback      = yaml
; Show which tasks actually changed something. On the second run this should
; be none, which is the property that distinguishes configuration management
; from a shell script.
display_skipped_hosts = False
interpreter_python   = auto_silent

[ssh_connection]
; Reuse one SSH connection per host instead of opening a new one per task.
; Roughly halves the runtime of this playbook.
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=60s
