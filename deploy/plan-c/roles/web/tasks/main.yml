---
# The web tier: the SPA and the public entry point.
#
# The only instance with a route from the internet. It serves the built
# bundle from disk and proxies everything Django-shaped to the API instance's
# private address.

- name: Download the NodeSource setup script
  ansible.builtin.get_url:
    url: https://rpm.nodesource.com/setup_22.x
    dest: /tmp/nodesource_setup.sh
    owner: root
    group: root
    mode: "0700"

# `curl | bash` is the vendor's documented one-liner, but it hides the script
# from review, cannot be made idempotent, and masks a failed download as a
# successful no-op because only the last exit code in the pipe survives.
# Downloading first and then running with `creates:` fixes all three.
- name: Register the NodeSource repository
  ansible.builtin.command:
    cmd: /tmp/nodesource_setup.sh
    creates: /etc/yum.repos.d/nodesource-nodejs.repo

- name: Install Node.js
  ansible.builtin.dnf:
    name: nodejs
    state: present

- name: Deploy the application source
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_root }}"
    version: "{{ repo_version }}"
    accept_hostkey: true
  become: false
  register: web_checkout

- name: Check whether frontend dependencies are installed
  ansible.builtin.stat:
    path: "{{ app_root }}/client/node_modules/.package-lock.json"
  register: web_node_modules

# `npm ci` deletes and reinstalls node_modules by design, so it can never
# report ok on its own. Guarding on the checkout gives the same guarantee --
# dependencies match the lockfile that was just cloned -- without reinstalling
# several hundred packages on every run.
- name: Install frontend dependencies
  community.general.npm:
    path: "{{ app_root }}/client"
    ci: true
  become: true
  become_user: "{{ app_user }}"
  when: web_checkout.changed or not web_node_modules.stat.exists

- name: Check whether the bundle has been built
  ansible.builtin.stat:
    path: "{{ app_root }}/client/dist/index.html"
  register: web_dist

# Conditioned on the checkout rather than `creates:`. With `creates:` the
# bundle is pinned forever: once dist/index.html exists the build never runs
# again, so a frontend change deploys silently as the previous bundle.
- name: Build the SPA bundle
  ansible.builtin.command:
    cmd: npm run build
    chdir: "{{ app_root }}/client"
  become: true
  become_user: "{{ app_user }}"
  when: web_checkout.changed or not web_dist.stat.exists
  changed_when: true
  register: web_build

- name: Template the runtime configuration
  ansible.builtin.template:
    src: config.js.j2
    dest: "{{ app_root }}/client/dist/config.js"
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0644"

- name: Ensure the web root's parent is traversable
  ansible.builtin.file:
    path: /var/www
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the web root
  ansible.builtin.file:
    path: "{{ web_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Publish the bundle to the web root
  ansible.builtin.copy:
    src: "{{ app_root }}/client/dist/"
    dest: "{{ web_root }}/"
    remote_src: true
    owner: root
    group: root
    # u=rwX,go=rX: 0755 on directories, 0644 on files.
    mode: "u=rwX,go=rX"

- name: Install the storefront site configuration
  ansible.builtin.template:
    src: web-nginx.conf.j2
    dest: /etc/nginx/conf.d/rmit-store.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Validate the nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Flush handlers so the verification below sees the new configuration
  ansible.builtin.meta: flush_handlers
