---
# What every instance needs regardless of its tier.

- name: Install base packages
  ansible.builtin.dnf:
    name:
      - git
      - nginx
    state: present

# Swap on a 1 GB instance is the difference between a frontend build
# completing and being OOM-killed with a bare "Killed" and no stack trace.
# Cheap enough to apply everywhere rather than reason about which tier needs
# it, and creates: means a re-run does nothing.
- name: Create the swap file
  ansible.builtin.command:
    cmd: dd if=/dev/zero of=/swapfile bs=1M count={{ swap_mb }}
    creates: /swapfile

- name: Restrict swap file permissions
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"

- name: Check whether the swap file is already active
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: common_swap_active
  changed_when: false

# `mkswap` on an already-formatted file is an error, so the signature check
# guards it. This is the pattern for any command module that is not
# naturally idempotent.
- name: Check whether the swap file is already formatted
  ansible.builtin.command: file -b /swapfile
  register: common_swap_type
  changed_when: false

- name: Format the swap file
  ansible.builtin.command: mkswap /swapfile
  changed_when: true
  when: "'swap file' not in common_swap_type.stdout"

- name: Enable swap now and on boot
  ansible.posix.mount:
    path: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Activate swap for this boot
  ansible.builtin.command: swapon /swapfile
  changed_when: true
  when: "'/swapfile' not in common_swap_active.stdout"

# Amazon Linux ships a port-80 server block inside
# nginx.conf, and nginx keeps the first default_server it parses. Since
# nginx.conf is read before conf.d/, the stock block wins and every request
# is answered by its 404 page -- including /healthz/, which makes it look
# like the site config was never installed.
#
# Replacing the whole file is more predictable than trying to comment out a
# block with a regex, and it is the single most confusing failure in the
# Plan B runbook.
- name: Install an nginx.conf that does not claim port 80
  ansible.builtin.copy:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload nginx
