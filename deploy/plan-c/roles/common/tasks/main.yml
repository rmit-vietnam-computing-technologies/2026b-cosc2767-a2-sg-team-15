---
# What every instance needs regardless of its tier.

- name: Install base packages
  ansible.builtin.dnf:
    name:
      - git
      - nginx
    state: present

# Swap: the frontend build is OOM-killed on a 1 GB instance without it.
- name: Create the swap file
  ansible.builtin.command:
    cmd: dd if=/dev/zero of=/swapfile bs=1M count={{ swap_mb }}
    creates: /swapfile

- name: Restrict swap file permissions
  ansible.builtin.file:
    path: /swapfile
    owner: root
    group: root
    mode: "0600"

- name: Check whether the swap file is already active
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: common_swap_active
  changed_when: false

# `mkswap` on a formatted file is an error; the signature check guards it.
- name: Check whether the swap file is already formatted
  ansible.builtin.command: file -b /swapfile
  register: common_swap_type
  changed_when: false

- name: Format the swap file
  ansible.builtin.command: mkswap /swapfile
  changed_when: true
  when: "'swap file' not in common_swap_type.stdout"

- name: Enable swap now and on boot
  ansible.posix.mount:
    path: none
    src: /swapfile
    fstype: swap
    opts: sw
    state: present

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Activate swap for this boot
  ansible.builtin.command: swapon /swapfile
  changed_when: true
  when: "'/swapfile' not in common_swap_active.stdout"

# Amazon Linux ships a default_server in nginx.conf that wins
# over conf.d/ and answers everything with its 404 page. Replace the file.
- name: Install an nginx.conf that does not claim port 80
  ansible.builtin.copy:
    src: nginx.conf
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload nginx
