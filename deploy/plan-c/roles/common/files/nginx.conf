# Acknowledgement: Derived from the stock Amazon Linux 2023 /etc/nginx/nginx.conf,
#   with the default port-80 server block removed. Reference: nginx core module,
#   https://nginx.org/en/docs/ngx_core_module.html

# Base nginx configuration, no default server.
#
# Identical to the Amazon Linux default except that the stock
# `server { listen 80 default_server; root /usr/share/nginx/html; }` block is
# gone. That block is parsed before conf.d/, so nginx keeps it as the
# default_server and answers every request with its own 404 page -- including
# the health probes, which makes a correct site config look uninstalled.
#
# Removing it here rather than commenting it out on each host means the
# playbook is idempotent and a rebuilt instance behaves identically.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # The tier-specific site file is installed here by the api or web role.
    include /etc/nginx/conf.d/*.conf;
}
