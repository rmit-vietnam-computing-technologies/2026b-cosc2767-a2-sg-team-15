# Acknowledgement: Derived from the stock Amazon Linux 2023 /etc/nginx/nginx.conf,
#   with the default port-80 server block removed. Reference: nginx core module,
#   https://nginx.org/en/docs/ngx_core_module.html

# The Amazon Linux default with its port-80
# default_server block removed, so the site in conf.d/ is the one that answers.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    keepalive_timeout   65;
    types_hash_max_size 4096;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # The tier-specific site file is installed here by the api or web role.
    include /etc/nginx/conf.d/*.conf;
}
