---
# The API tier: clone, venv, config, migrate,
# collectstatic, gunicorn under systemd, nginx in front. ALLOWED_HOSTS is
# assembled from instance metadata and inventory, never typed.

- name: Install Python and build tooling
  ansible.builtin.dnf:
    name:
      - python3.11
      - python3.11-pip
      - libpq-devel
    state: present

# This instance's own addresses from IMDS (v2, token handled
# by the module).
- name: Gather EC2 metadata
  amazon.aws.ec2_metadata_facts:

- name: Record this instance's private address
  ansible.builtin.set_fact:
    api_private_ip: "{{ ansible_ec2_local_ipv4 }}"

- name: Deploy the application source
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_root }}"
    version: "{{ repo_version }}"
    accept_hostkey: true
  become: false
  register: api_checkout

# The deployed commit, read from the checkout; /api/version/ reports it.
- name: Record the deployed commit
  ansible.builtin.set_fact:
    api_deployed_commit: "{{ api_checkout.after[:7] }}"

# The virtualenv must be at webapp/server/.venv; rmit-api.service references
# that path (a wrong path is systemd status=203/EXEC).
- name: Create the virtualenv and install dependencies
  ansible.builtin.pip:
    requirements: "{{ app_root }}/webapp/server/requirements.txt"
    virtualenv: "{{ app_root }}/webapp/server/.venv"
    virtualenv_command: python3.11 -m venv
  become: true
  become_user: "{{ app_user }}"
  notify: Restart rmit-api

# Configuration to /etc, root-owned, mode 600: the home
# directory is world-traversable for nginx, so a .env there would be readable.
- name: Create the configuration directory
  ansible.builtin.file:
    path: /etc/rmit-store
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Template the API environment
  ansible.builtin.template:
    src: api.env.j2
    dest: /etc/rmit-store/api.env
    owner: root
    group: root
    mode: "0600"
  notify: Restart rmit-api

- name: Install the systemd unit
  ansible.builtin.template:
    src: rmit-api.service.j2
    dest: /etc/systemd/system/rmit-api.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart rmit-api

# --------------------------------------------------------------------------
# Schema and static files
# --------------------------------------------------------------------------

# A separate, ordered step, never the service entrypoint,
# so two replicas cannot race on the schema.
- name: Apply database migrations
  ansible.builtin.command:
    cmd: "{{ venv_bin }}/python manage.py migrate --noinput"
    chdir: "{{ app_root }}/webapp/server"
  environment: "{{ django_environment }}"
  become: true
  become_user: "{{ app_user }}"
  register: api_migrate
  changed_when: "'No migrations to apply' not in api_migrate.stdout"

- name: Ensure the deployment state directory exists
  ansible.builtin.file:
    path: /var/lib/rmit-store
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Seed the demo catalogue
  ansible.builtin.command:
    cmd: >-
      {{ venv_bin }}/python manage.py seed_demo --demo-users
      --admin-email {{ seed_admin_email }}
      --admin-password {{ seed_admin_password }}
    chdir: "{{ app_root }}/webapp/server"
    creates: /var/lib/rmit-store/.demo-seeded
  environment: "{{ django_environment }}"
  become: true
  become_user: "{{ app_user }}"
  when: seed_demo_data | bool
  register: api_seed

- name: Record that the demo catalogue has been seeded
  ansible.builtin.file:
    path: /var/lib/rmit-store/.demo-seeded
    state: touch
    owner: root
    group: root
    mode: "0644"
  when:
    - seed_demo_data | bool
    - api_seed is changed

# collectstatic under the same settings module as the server:
# prod writes the whitenoise manifest, dev does not, and the admin 500s without it.
- name: Collect static files
  ansible.builtin.command:
    cmd: "{{ venv_bin }}/python manage.py collectstatic --noinput"
    chdir: "{{ app_root }}/webapp/server"
  environment: "{{ django_environment }}"
  become: true
  become_user: "{{ app_user }}"
  register: api_collect
  changed_when: "'0 static files copied' not in api_collect.stdout"

- name: Ensure the media directory exists
  ansible.builtin.file:
    path: "{{ app_root }}/webapp/server/media"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

# nginx must traverse the application user's home to reach
# media/ and staticfiles/. 0711: traverse without listing. One instance only.
- name: Allow nginx to traverse into the application user's home
  ansible.builtin.file:
    path: "/home/{{ app_user }}"
    mode: "0711"

# --------------------------------------------------------------------------
# Serving
# --------------------------------------------------------------------------

# nginx serves media and static off disk and proxies the rest to gunicorn;
# Django does not serve media under prod settings.
- name: Install the API site configuration
  ansible.builtin.template:
    src: api-nginx.conf.j2
    dest: /etc/nginx/conf.d/rmit-api.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Validate the nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start the API service
  ansible.builtin.systemd:
    name: rmit-api
    enabled: true
    state: started
    daemon_reload: true

- name: Flush handlers so later checks see the new configuration
  ansible.builtin.meta: flush_handlers

# /readyz/, not /healthz/: proves database and storage before
# the web tier is pointed here.
- name: Wait for the API to report ready
  ansible.builtin.uri:
    url: "http://{{ api_private_ip }}/readyz/"
    status_code: 200
  retries: 10
  delay: 3
  register: api_readyz
  until: api_readyz is succeeded
