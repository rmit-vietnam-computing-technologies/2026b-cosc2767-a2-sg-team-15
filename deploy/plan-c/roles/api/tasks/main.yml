---
# The API tier.
#
# Everything the Plan B runbook does by hand between cloning the repository
# and starting gunicorn, with one substantive change: no address is typed by
# a human. ALLOWED_HOSTS is assembled from instance metadata and inventory
# facts, which is the single biggest source of wasted time in the manual
# process -- the Elastic IP changed twice during the Plan B session, and each
# change meant editing four variables by hand.

- name: Install Python and build tooling
  ansible.builtin.dnf:
    name:
      - python3.11
      - python3.11-pip
      - libpq-devel
    state: present

# [T15-BE-HOSTHDR] Read this instance's own addresses from IMDS.
#
# IMDSv2 is Required on these instances, so the token exchange is mandatory.
# This module handles it; a plain curl against 169.254.169.254 without a
# token returns 401 and the failure looks like the metadata service is down.
- name: Gather EC2 metadata
  amazon.aws.ec2_metadata_facts:

- name: Record this instance's private address
  ansible.builtin.set_fact:
    api_private_ip: "{{ ansible_ec2_local_ipv4 }}"

- name: Deploy the application source
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_root }}"
    version: "{{ repo_version }}"
    accept_hostkey: true
  become: false
  register: api_checkout

# [ADV-3] The commit that is actually deployed, read from the checkout rather
# than passed in. GET /api/version/ reports this, which is how a deploy is
# verified from outside the instance and how a blue/green cutover is
# confirmed. A value supplied by hand can be wrong; this one cannot.
- name: Record the deployed commit
  ansible.builtin.set_fact:
    api_deployed_commit: "{{ api_checkout.after[:7] }}"

# The virtualenv must be at server/.venv. rmit-api.service references that
# path, and a venv one level up produces status=203/EXEC from systemd -- an
# error that says nothing about paths. It also matches the laptop layout in
# docs/TESTING.md, so one set of instructions works in both places.
- name: Create the virtualenv and install dependencies
  ansible.builtin.pip:
    requirements: "{{ app_root }}/server/requirements.txt"
    virtualenv: "{{ app_root }}/server/.venv"
    virtualenv_command: python3.11 -m venv
  become: true
  become_user: "{{ app_user }}"
  notify: Restart rmit-api

# [T15-BE-SECRETS] Configuration to /etc, root-owned, mode 600.
#
# Serving media off disk needs the application user's home directory to be
# world-traversable (below), so a .env inside the checkout would be readable
# by any local account. Same twelve-factor shape, permissions that mean
# something -- and the same idea as --env-file once this becomes a container.
- name: Create the configuration directory
  ansible.builtin.file:
    path: /etc/rmit-store
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Template the API environment
  ansible.builtin.template:
    src: api.env.j2
    dest: /etc/rmit-store/api.env
    owner: root
    group: root
    mode: "0600"
  notify: Restart rmit-api

- name: Install the systemd unit
  ansible.builtin.template:
    src: rmit-api.service.j2
    dest: /etc/systemd/system/rmit-api.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart rmit-api

# --------------------------------------------------------------------------
# Schema and static files
# --------------------------------------------------------------------------

# `migrate` is a separate, explicitly ordered step and never runs from the
# service entrypoint. Two API replicas starting at once would otherwise race
# to apply the same migration. Ansible runs this on one host at a time, which
# is the property that makes it safe here and the reason the container work
# in Plan F keeps migrations out of the entrypoint too.
- name: Apply database migrations
  ansible.builtin.command:
    cmd: "{{ venv_bin }}/python manage.py migrate --noinput"
    chdir: "{{ app_root }}/server"
  environment: "{{ django_environment }}"
  become: true
  become_user: "{{ app_user }}"
  register: api_migrate
  changed_when: "'No migrations to apply' not in api_migrate.stdout"

- name: Ensure the deployment state directory exists
  ansible.builtin.file:
    path: /var/lib/rmit-store
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Seed the demo catalogue
  ansible.builtin.command:
    cmd: >-
      {{ venv_bin }}/python manage.py seed_demo --demo-users
      --admin-email {{ seed_admin_email }}
      --admin-password {{ seed_admin_password }}
    chdir: "{{ app_root }}/server"
    creates: /var/lib/rmit-store/.demo-seeded
  environment: "{{ django_environment }}"
  become: true
  become_user: "{{ app_user }}"
  when: seed_demo_data | bool
  register: api_seed

- name: Record that the demo catalogue has been seeded
  ansible.builtin.file:
    path: /var/lib/rmit-store/.demo-seeded
    state: touch
    owner: root
    group: root
    mode: "0644"
  when:
    - seed_demo_data | bool
    - api_seed is changed

# [T15-BE-STATIC] collectstatic must run under the SAME settings module as
# the server. Dev uses StaticFilesStorage and writes no manifest; prod uses
# whitenoise's manifest storage and requires staticfiles.json. Get this wrong
# and /static/admin/css/base.css still returns 200 while /admin/login/
# returns 500 -- so a check that only tested static files would pass a
# broken deployment.
- name: Collect static files
  ansible.builtin.command:
    cmd: "{{ venv_bin }}/python manage.py collectstatic --noinput"
    chdir: "{{ app_root }}/server"
  environment: "{{ django_environment }}"
  become: true
  become_user: "{{ app_user }}"
  register: api_collect
  changed_when: "'0 static files copied' not in api_collect.stdout"

- name: Ensure the media directory exists
  ansible.builtin.file:
    path: "{{ app_root }}/server/media"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_user }}"
    mode: "0755"

# [T15-BE-MEDIA] nginx runs as its own user and must traverse into the
# application user's home to reach media/ and staticfiles/.
#
# Mode 0711 grants traverse without read, so nothing else in the home
# directory is listable. Needing this at all is the argument for S3: it works
# for exactly one instance, and the moment a second API replica exists an
# image uploaded to one is a 404 from the other.
- name: Allow nginx to traverse into the application user's home
  ansible.builtin.file:
    path: "/home/{{ app_user }}"
    mode: "0711"

# --------------------------------------------------------------------------
# Serving
# --------------------------------------------------------------------------

# nginx on the API instance serves media and static files off local disk and
# proxies everything else to gunicorn. gunicorn cannot serve either: Django
# returns 404 for uploaded media under a production settings module by
# design, so proxying /media/ straight to port 8000 proxies you to a 404.
- name: Install the API site configuration
  ansible.builtin.template:
    src: api-nginx.conf.j2
    dest: /etc/nginx/conf.d/rmit-api.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload nginx

- name: Validate the nginx configuration
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Enable and start the API service
  ansible.builtin.systemd:
    name: rmit-api
    enabled: true
    state: started
    daemon_reload: true

- name: Flush handlers so later checks see the new configuration
  ansible.builtin.meta: flush_handlers

# Readiness, not liveness. /healthz/ answers as soon as the process binds;
# /readyz/ opens a database cursor and touches storage, so it is the one that
# proves this tier is actually able to serve before the web tier is pointed
# at it.
- name: Wait for the API to report ready
  ansible.builtin.uri:
    url: "http://{{ api_private_ip }}/readyz/"
    status_code: 200
  retries: 10
  delay: 3
  register: api_readyz
  until: api_readyz is succeeded
