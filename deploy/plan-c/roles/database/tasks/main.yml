---
# PostgreSQL on the API instance, localhost only.
# Skipped when db_host is not "localhost", so the same playbook targets RDS.

- name: Install PostgreSQL
  ansible.builtin.dnf:
    name:
      - postgresql16
      - postgresql16-server
      - python3-psycopg2
    state: present

- name: Check whether the cluster is initialised
  ansible.builtin.stat:
    path: /var/lib/pgsql/data/PG_VERSION
  register: database_pgdata

- name: Initialise the cluster
  ansible.builtin.command: postgresql-setup --initdb
  changed_when: true
  when: not database_pgdata.stat.exists

# Red Hat's initdb writes `ident` for TCP; Django needs password
# auth. Only the `host` lines change; `local ... peer` stays for psql.
- name: Require password authentication for TCP connections
  ansible.builtin.replace:
    path: /var/lib/pgsql/data/pg_hba.conf
    regexp: '^(host.*\s+)ident$'
    replace: '\1scram-sha-256'
  notify: Reload postgresql

- name: Enable and start PostgreSQL
  ansible.builtin.systemd:
    name: postgresql
    enabled: true
    state: started

- name: Flush handlers so the database is reloaded before it is used
  ansible.builtin.meta: flush_handlers

- name: Create the application role
  community.postgresql.postgresql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    role_attr_flags: LOGIN,CREATEDB
  become: true
  become_user: postgres

- name: Create the application database
  community.postgresql.postgresql_db:
    name: "{{ db_name }}"
    owner: "{{ db_user }}"
  become: true
  become_user: postgres

# Fail here with a clear message rather than at the first migration.
- name: Verify the application can connect over TCP
  community.postgresql.postgresql_ping:
    login_host: 127.0.0.1
    login_user: "{{ db_user }}"
    login_password: "{{ db_password }}"
    db: "{{ db_name }}"
  changed_when: false
