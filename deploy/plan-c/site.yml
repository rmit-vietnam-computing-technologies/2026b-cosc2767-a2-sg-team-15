---
# Split-tier deployment: API and database on one
# instance, the SPA behind nginx on another.
#
#     ansible-playbook -i inventory.ini site.yml
#
# Play order is the dependency graph: database, then API, then web.
# Idempotent; a second run reports zero changed.

- name: Base configuration common to every instance
  hosts: all
  become: true
  roles:
    - common

- name: Database tier
  hosts: api
  become: true
  roles:
    - role: database
      when: db_host == "localhost"
  tags: [database]

- name: API tier
  hosts: api
  become: true
  roles:
    - api
  tags: [api]

- name: Web tier
  hosts: web
  become: true
  roles:
    - web
  tags: [web]

- name: Verify the deployment answers
  hosts: web
  gather_facts: false
  tags: [verify]
  tasks:
    # Cheapest proof the deploy produced a working site, via the public address.
    - name: Wait for the storefront to answer
      ansible.builtin.uri:
        url: "http://{{ web_public_ip }}/healthz/"
        status_code: 200
      retries: 10
      delay: 3
      register: verify_healthz
      until: verify_healthz is succeeded
      delegate_to: localhost
      become: false

    # /healthz/ is proxied, so it once passed while / returned 403. Test / too.
    - name: Confirm the storefront itself renders
      ansible.builtin.uri:
        url: "http://{{ web_public_ip }}/"
        return_content: true
      register: verify_spa
      failed_when: '"<div id=\"app\"" not in verify_spa.content'
      delegate_to: localhost

    - name: Report where to point the smoke suite
      ansible.builtin.debug:
        msg: >-
          Deployed. Now run, from a laptop:
          SMOKE_BASE_URL=http://{{ web_public_ip }}
          SMOKE_SPA_BASE_URL=http://{{ web_public_ip }}
          pytest -m smoke --no-cov
