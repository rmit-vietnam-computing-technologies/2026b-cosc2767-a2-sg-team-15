# prod: its own namespace and node port. Everything else is the base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base

patches:
  - target:
      kind: Service
      name: api
    patch: |-
      - op: replace
        path: /spec/ports/0/port
        value: 80
