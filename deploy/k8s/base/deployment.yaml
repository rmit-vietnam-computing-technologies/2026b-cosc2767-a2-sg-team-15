# Two replicas from the start: that is what forces media onto S3.
# IMAGE_PLACEHOLDER and CONFIG_HASH_PLACEHOLDER are substituted by deploy.sh.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api
      # Hash of the ConfigMap and Secret contents. A rotated password or a
      # new setting changes it and rolls the pods; a Secret update on its
      # own never restarts anything.
      annotations:
        rmit-store/config-hash: CONFIG_HASH_PLACEHOLDER
    spec:
      # gunicorn's graceful stop is 30s; give it room.
      terminationGracePeriodSeconds: 35
      imagePullSecrets:
        - name: ecr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: api
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          # nginx rewrites Host on these two paths, so the pod IP never trips ALLOWED_HOSTS.
          readinessProbe:
            httpGet:
              path: /readyz/
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              memory: 512Mi