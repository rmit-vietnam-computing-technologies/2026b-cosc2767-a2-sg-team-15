# The API tier. Config and secrets are created by deploy/bin/deploy.sh from
# the per-environment env files, never from here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - hpa.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: rmit-store
    includeSelectors: false
