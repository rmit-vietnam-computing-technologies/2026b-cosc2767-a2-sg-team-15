# LoadBalancer on k3s means ServiceLB binds the port on the node itself.
# Overlays set the port: 80 for prod, 8080 for staging.
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: LoadBalancer
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
