# Runs once per deploy, before the Deployment rolls, with the new image.
# Two replicas never race on the schema this way. Never retried on failure:
# a failed migration stops the pipeline, it does not loop.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ecr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: migrate
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          args: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
