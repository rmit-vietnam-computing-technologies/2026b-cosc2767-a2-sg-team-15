# Demo catalogue plus demo accounts. Idempotent upstream, so re-running is safe.
# The admin credentials come from the Secret; $(VAR) is expanded by Kubernetes.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ecr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: seed
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          args:
            - python
            - manage.py
            - seed_demo
            - --demo-users
            - --admin-email
            - $(SEED_ADMIN_EMAIL)
            - --admin-password
            - $(SEED_ADMIN_PASSWORD)
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
