# Demo catalogue plus demo accounts. create_admin runs first because it
# updates the password of an existing account and seed_demo does not, so the
# admin always matches what SSM holds. Safe to re-run.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ecr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: seed
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -e
              python manage.py create_admin --email "$SEED_ADMIN_EMAIL" --password "$SEED_ADMIN_PASSWORD"
              python manage.py seed_demo --demo-users --admin-email "$SEED_ADMIN_EMAIL" --admin-password "$SEED_ADMIN_PASSWORD"
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
