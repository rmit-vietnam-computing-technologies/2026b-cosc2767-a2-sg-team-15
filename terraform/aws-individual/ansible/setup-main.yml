---
- name: Configure Main EC2 instance
  hosts: main_instance
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        upgrade: yes

    - name: Install nginx
      apt:
        name: nginx
        state: present

    - name: Enable and start nginx
      systemd:
        name: nginx
        enabled: true
        state: started
