[prometheus_instance]
<prometheus_ec2_ip> ansible_user=admin ansible_ssh_private_key_file=../../labsuser.pem

[prometheus_instance:vars]
ansible_python_interpreter=/usr/bin/python3

[jenkins_instance]
<jenkins_ec2_ip> ansible_user=admin ansible_ssh_private_key_file=../../labsuser.pem

[jenkins_instance:vars]
ansible_python_interpreter=/usr/bin/python3
fqdn=jenkins.example.com
letsenc_email=hello@example.com

[jenkins_buildnode]
<buildnode_ec2_ip> ansible_user=admin ansible_ssh_private_key_file=../../labsuser.pem

[jenkins_buildnode:vars]
ansible_python_interpreter=/usr/bin/python3
jenkins_host=jenkins.example.com
