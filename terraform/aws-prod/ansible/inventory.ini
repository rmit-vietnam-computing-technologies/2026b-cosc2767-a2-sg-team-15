[prometheus_instance]
prometheus.example.com ansible_user=admin ansible_ssh_private_key_file=../../labsuser.pem

[prometheus_instance:vars]
ansible_python_interpreter=/usr/bin/python3
fqdn=prometheus.example.com
letsenc_email=email@example.com

[jenkins_instance]
jenkins.example.com ansible_user=admin ansible_ssh_private_key_file=../../labsuser.pem

[jenkins_instance:vars]
ansible_python_interpreter=/usr/bin/python3
fqdn=jenkins.example.com
letsenc_email=email.example.com

[jenkins_buildnode]
<jenkins_buildnode_ip> ansible_user=admin ansible_ssh_private_key_file=../.../labsuser.pem

[jenkins_buildnode:vars]
ansible_python_interpreter=/usr/bin/python3
jenkins_host=jenkins.example.com
jenkins_secret=
