---
- name: Setup Monitoring instance
  hosts: monitoring_instance
  become: true

  tasks:
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required dependencies
      apt:
        pkg:
          - gnupg
          - git
          - curl
          - ca-certificates
        state: present

    # Adapted from Docker guide: https://docs.docker.com/engine/install/debian/
    - name: Create apt keyring dir
      file:
        path: /etc/apt/keyrings/
        state: directory
        mode: '0755'

    - name: Download Docker repo key
      get_url:
        url: https://download.docker.com/linux/debian/gpg
        dest: /etc/apt/keyrings/docker.asc
        # sudo chmod a+r /etc/apt/keyrings/docker.asc
        mode: '0644'

    - name: Add docker apt repo
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        state: present

    - name: Install docker, python3 docker sdk, and nginx
      apt:
        pkg:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - docker-compose
          - python3-docker
          - nginx
        state: present

    - name: Enable and start Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Add user to docker group
      user:
        name: admin
        groups: docker
        append: true

    - name: Copy prometheus config to server
      copy:
        src: monitoring/prometheus/prometheus.yml
        dest: /etc/prometheus/prometheus.yml
        owner: root
        group: root
        mode: '0644'
        

    - name: Pull Prometheus docker image
      community.docker.docker_image:
      name: prom/prometheus:latest
      source: pull

    - name: Start Prometheus container
      community.docker.docker_image:
      name: prometheus
      image: prom/prometheus:latest
      state: started
      restart-policy: unless-stopped
      ports:
        - "9090:9090"
      volumes:
        - /etc/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      command:
        - "--config.file=etc/prometheus/prometheus.yml"

    #(leaving it here just to ask if its possible (all the config, pull and start the containers's code are in docker-compose.yml)
    # - name: Copy monitoring configuration to server
    #   copy:
    #     src: monitoring/
    #     dest: /opt/rmit-store/monitoring/
    #     owner: admin
    #     group: admin
    #     mode: '0755'

    # - name: Start monitoring stack with Docker Compose
    #   command:
    #     cmd: docker-compose up -d
    #     chdir: /opt/rmit-store/monitoring

    - name: Setup nginx site for Prometheus
      # bao step...

    - name: Remove default nginx site config
      file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Enable prometheus nginx site
      # bao step...

    - name: Check nginx configuration
      command: nginx -t

    - name: Provision let's encrypt certificate for nginx
      command: 'certbot -d {{ fqdn }} --agree-tos -m {{ letsenc_email }}'

    - name: Enable and restart nginx
      systemd:
        name: nginx
        state: restarted
        enabled: true
