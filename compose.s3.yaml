# Acknowledgement: The switch is upstream's own USE_S3 (server/config/settings/base.py);
#   this file only supplies what a laptop lacks that an instance has.
#   Drafted with Claude (Anthropic) in a guided session; the author ran and
#   verified it. Reference: boto3 credential resolution order,
#   https://boto3.amazonaws.com/v1/documentation/api/latest/guide/credentials.html

# Rehearse the S3 switch from a laptop.
#
# On an instance the API gets bucket credentials from its instance role and
# nothing is configured. A laptop has no role, so this overlay passes the
# Learner Lab's session credentials from the shell -- never from .env, never
# from a file -- into the two services that touch storage:
#
#     export AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... AWS_SESSION_TOKEN=...
#     USE_S3=True AWS_STORAGE_BUCKET_NAME=<bucket> \
#         docker compose -f compose.yaml -f compose.s3.yaml up -d --build
#
# What this proves before any instance exists: /readyz/ reports storage ok
# against the real bucket, seed_demo writes 47 objects, image_url points at
# S3 and a browser loads it. What it exposes early: region, bucket policy,
# and whether LabRole reaches the bucket at all.
#
# The credentials expire with the Learner Lab session, which is the only
# reason they are acceptable here. They are the anti-pattern the brief
# names, and this file is not used on any instance.

services:

  api:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?export the Learner Lab session credentials first}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?export the Learner Lab session credentials first}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:?export the Learner Lab session credentials first}

  seed:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?export the Learner Lab session credentials first}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?export the Learner Lab session credentials first}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:?export the Learner Lab session credentials first}
