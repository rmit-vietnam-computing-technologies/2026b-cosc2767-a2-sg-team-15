#   Drafted with Claude (Anthropic) in a guided session; the author ran and
#   verified it. Reference: boto3 credential resolution order,
#   https://boto3.amazonaws.com/v1/documentation/api/latest/guide/credentials.html

# Rehearse the S3 switch from a laptop.
#
# On an instance the API gets bucket credentials from its role. A laptop has
# none, so this overlay passes the Learner Lab session credentials from the
# shell (never from .env) to the two services that touch storage:
#
#     export AWS_ACCESS_KEY_ID=... AWS_SECRET_ACCESS_KEY=... AWS_SESSION_TOKEN=...
#     USE_S3=True AWS_STORAGE_BUCKET_NAME=<bucket> \
#         docker compose -f compose.yaml -f compose.s3.yaml up -d --build
#
# Laptop only. Not used on any instance.

services:

  api:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?export the Learner Lab session credentials first}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?export the Learner Lab session credentials first}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:?export the Learner Lab session credentials first}

  seed:
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?export the Learner Lab session credentials first}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?export the Learner Lab session credentials first}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:?export the Learner Lab session credentials first}
